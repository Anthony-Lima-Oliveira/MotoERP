{% extends "base.html" %}

{% block titulo %}Entrar | MotoERP{% endblock %}

{% block corpo %}
<main class="login">
    <div class="login-caixa">
        <div class="placa">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="MotoERP">
        </div>

        <form method="POST" class="painel">
            <h1 class="titulo-login">Entrar no estoque</h1>

            {% if erro %}
            <p class="aviso aviso-erro" role="alert">{{ erro }}</p>
            {% endif %}

            <label for="usuario">Usuário</label>
            <input id="usuario" name="usuario" autocomplete="username" autofocus required>

            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" autocomplete="current-password" required>

            <button class="btn-cheio">Entrar</button>
        </form>
    </div>
</main>
{% endblock %}
